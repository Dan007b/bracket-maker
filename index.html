  } else if (T.style === "rr") {
    body = `<div class="section split"><div>${titleH2("Standings")}${standingsTable(T.teams.map(x => x.id), T.matches, out)}</div>
      <div style="min-width:0">${titleH2("Schedule", "Play in order, left to right.")}${flowRounds(roundsOf("RR"), ctx, r => sitsOut(roundsOf("RR")[r], T.teams.map(x => x.id)))}</div></div>`;
  } else if (T.style === "sw") {
    const ms = T.matches.filter(m => m.br === "S");
    const roundDone = ms.filter(m => m.rd === T.swissRound).every(m => ["done", "bye"].includes(out[m.id].status));
    const canPair = roundDone && T.swissRound < T.opts.rounds;
    body = `<div class="section split"><div>${titleH2("Standings")}${standingsTable(T.teams.map(x => x.id), ms, out)}</div>
      <div style="min-width:0">${titleH2(`Round ${T.swissRound} of ${T.opts.rounds}`, canPair ? "" : (T.swissRound < T.opts.rounds ? "Finish this round to pair the next one." : "Final round."))}
      ${canPair ? `<p><button class="btn primary big" id="pair">Pair round ${T.swissRound + 1}</button></p>` : ""}
      ${flowRounds(roundsOf("S"), ctx, () => "")}</div></div>`;
  } else if (T.style === "gp") {
    body = `<div class="section">${titleH2("Groups", `Top ${T.opts.advance} from each group advance.`)}<div class="groups">` +
      T.groups.map((g, gi) => {
        const ms = T.matches.filter(m => m.br === "G" + gi);
        const rs = roundsOf("G" + gi);
        return `<div class="group"><h3>Group ${String.fromCharCode(65 + gi)}</h3>${standingsTable(g, ms, out, T.opts.advance)}${flowRounds(rs, ctx, r => sitsOut(rs[r], g))}</div>`;
      }).join("") + `</div></div>`;
    if (T.matches.some(m => m.br === "P")) body += section("Playoffs", "Filled in as each group finishes.", seBoard("P", ctx, T.thirdId));
  }

  $("#app").innerHTML = `
    <section class="board">
      <div class="board-head">
        <div><p class="eyebrow">${STYLES[T.style].name} · ${T.teams.length} teams · best of ${T.bo}${T.finalBo !== T.bo ? `, finals best of ${T.finalBo}` : ""}</p><h1>${esc(T.name)}</h1></div>
        <div class="progress"><span>${doneCount} of ${real.length} matches played</span><div class="bar"><i style="width:${real.length ? (100 * doneCount / real.length).toFixed(1) : 0}%"></i></div></div>
      </div>
      <div class="callouts">${callouts}</div>
      <div class="tools">
        <p class="hint">Click a team to give them the win${T.bo > 1 || T.finalBo > 1 ? " (or one round, in best-of matches)" : ""}. Click the winner again to undo. <b>Edit</b> sets scores. Click a match number to highlight its path, then <b>Match view</b> to show just that match on screen. <b>Present bracket</b> fills the screen with the whole bracket.</p>
        ${ui.focus && num[ui.focus] ? `<span class="focus-chip">Highlighting M${num[ui.focus]} <button class="btn ghost" id="focus-fs">Match view</button><button class="btn ghost" id="clear-focus">Clear</button></span>` : ""}
        ${T.style === "se" || (T.style === "gp" && T.matches.some(m => m.br === "P")) ? `<div class="seg" id="layout-seg" aria-label="Bracket layout"><button type="button" data-v="right" aria-pressed="${T.layout !== "center"}">Final on right</button><button type="button" data-v="center" aria-pressed="${T.layout === "center"}">Final in center</button></div>` : ""}
        ${nextId || deckId ? `<button class="btn primary" id="mv-open" title="Show the next match up on its own">Show next match</button>` : ""}
        <div class="zoom"><button id="z-out" aria-label="Zoom out">−</button><span id="z-val">${Math.round(zoom * 100)}%</span><button id="z-in" aria-label="Zoom in">+</button><button id="z-fit">Fit</button></div>
        <button class="btn" id="fs" title="Fill the screen with the whole bracket">Present bracket</button>
        <button class="btn${pod[0] ? " primary" : ""}" id="save-img">Save image</button>
      </div>
      <div id="zc" style="zoom:${zoom}">${body}</div>
    </section>`;

  document.querySelectorAll(".scroll[data-k]").forEach(s => { if (scrolls[s.dataset.k] != null) s.scrollLeft = scrolls[s.dataset.k]; });
  const zc = $("#zc");
  zc.addEventListener("click", e => {
    const slot = e.target.closest("button.slot");
    if (slot) return clickSlot(slot.dataset.m, +slot.dataset.side);
    const ed = e.target.closest(".edit");
    if (ed) return editMatch(ed.dataset.m);
    const mh = e.target.closest("[data-mv]");
    if (mh) return openMatchView(mh.dataset.mv);
    const fh = e.target.closest("[data-focus]");
    if (fh) { ui.focus = ui.focus === fh.dataset.focus ? null : fh.dataset.focus; return render(); }
    if (ui.focus && !e.target.closest(".match")) { ui.focus = null; render(); }
  });
  const cf = $("#clear-focus"); if (cf) cf.onclick = () => { ui.focus = null; render(); };
  const ff = $("#focus-fs"); if (ff) ff.onclick = () => openMatchView(ui.focus);
  const ci = $("#champ-img"); if (ci) ci.onclick = () => exportImage().catch(() => toast("Couldn't make the image. Try again."));
  const si = $("#save-img"); if (si) si.onclick = () => exportImage().catch(() => toast("Couldn't make the image. Try again."));
  const mo = $("#mv-open"); if (mo) mo.onclick = () => openMatchView(nextId || deckId);
  const ls = $("#layout-seg");
  if (ls) ls.querySelectorAll("button").forEach(b => b.onclick = () => { T.layout = b.dataset.v; draft.layout = b.dataset.v; saveT(); saveDraft(); render(); });
  renderMatchView(ctx, pod);
  document.querySelectorAll("[data-goto]").forEach(b => b.onclick = () => gotoMatch(b.dataset.goto));
  const pair = $("#pair"); if (pair) pair.onclick = pairSwiss;
  const setZoom = z => { zoom = clamp(Math.round(z * 100) / 100, .4, 2.5); lsSet(LS_Z, zoom); zc.style.zoom = zoom; $("#z-val").textContent = Math.round(zoom * 100) + "%"; };
  $("#z-in").onclick = () => setZoom(zoom + .1);
  $("#z-out").onclick = () => setZoom(zoom - .1);
  $("#z-fit").onclick = () => {
    const widest = Math.max(0, ...[...document.querySelectorAll("[data-w]")].map(x => +x.dataset.w));
    const avail = zc.clientWidth || $("#app").clientWidth;
    setZoom(widest ? clamp(avail / (widest + 8), .4, 1.6) : 1);
  };
  $("#fs").onclick = () => {
    const el = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else if (el.requestFullscreen) el.requestFullscreen().catch(() => toast("Present mode is not available here. Use your browser's full-screen key (F11) instead."));
    else toast("Present mode is not available here. Use your browser's full-screen key (F11) instead.");
  };
}

function gotoMatch(id) {
  const el = document.querySelector(`.match[data-id="${id}"]`);
  if (!el) return;
  el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center", inline: "center" });
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}

const titleH2 = (t, sub) => `<h2 style="font-size:26px;margin-bottom:10px">${esc(t)}${sub ? ` <small style="font-family:var(--body);font-size:13.5px;font-weight:500;color:var(--muted)">${esc(sub)}</small>` : ""}</h2>`;
const section = (t, sub, inner) => `<div class="section"><h2>${esc(t)}${sub ? `<small>${esc(sub)}</small>` : ""}</h2>${inner}</div>`;
function roundsOf(br) {
  const rs = [];
  T.matches.filter(m => m.br === br).forEach(m => { (rs[m.rd - 1] = rs[m.rd - 1] || []).push(m.id); });
  return rs.filter(Boolean);
}
function sitsOut(ids, teamIds) {
  if (!ids) return "";
  const playing = new Set();
  ids.forEach(id => { const m = getM(id); [m.a, m.b].forEach(s => s && s.t === "team" && playing.add(s.id)); });
  const off = teamIds.filter(id => !playing.has(id));
  return off.length ? `<div class="sits">Sits out: ${off.map(id => esc(teamName(id))).join(", ")}</div>` : "";
}

function roundName(br, i, total) {
  const fromEnd = total - i;
  if (br === "L") return fromEnd === 1 ? "Losers final" : `Losers R${i + 1}`;
  if (br === "W" && T.style === "de") return fromEnd === 1 ? "Winners final" : `Winners R${i + 1}`;
  if (fromEnd === 1) return "Final";
  if (fromEnd === 2) return "Semifinals";
  if (fromEnd === 3) return "Quarterfinals";
  return `Round of ${2 ** fromEnd}`;
}

function slotLabel(m, side, ctx) {
  if (m.cond === "reset") return "If needed";
  const s = side ? m.b : m.a;
  if (!s) return "TBD";
  if (s.t === "W") {
    if (ctx.num[s.m]) return `Winner of M${ctx.num[s.m]}`;
    // the feeder is a bye: describe whoever walks through it
    const f = getM(s.m), fo = ctx.out[s.m];
    return slotLabel(f, fo.A === BYE ? 1 : 0, ctx);
  }
  if (s.t === "L") return ctx.num[s.m] ? `Loser of M${ctx.num[s.m]}` : "TBD";
  if (s.t === "grp") return `Group ${String.fromCharCode(65 + s.g)} #${s.r + 1}`;
  return "TBD";
}

function matchCard(id, ctx, style = "", focusCls = "") {
  const m = getM(id), o = ctx.out[id];
  const bo = boOf(m);
  const ghost = o.status === "bye" || o.status === "skip";
  const cls = ["match", focusCls, ghost ? "ghost" : "", id === ctx.nextId ? "next" : "", id === ctx.deckId ? "deck" : "", o.status === "live" ? "live" : ""].filter(Boolean).join(" ");
  const playable = ["ready", "live", "done"].includes(o.status);
  let pill = "";
  if (id === ctx.nextId) pill = `<span class="pill next">Next up</span>`;
  else if (id === ctx.deckId) pill = `<span class="pill deck">On deck</span>`;
  else if (o.status === "live") pill = `<span class="pill live">Live</span>`;
  const head = `<div class="mhead"${ghost ? "" : ` data-focus="${id}" title="${ui.focus === id ? "Click to stop highlighting" : "Click to highlight this match's path"}"`}><span class="mnum">${o.status === "bye" ? "Bye" : o.status === "skip" ? "Not needed" : "M" + ctx.num[id]}</span>${!ghost && bo > 1 ? `<span>Bo${bo}</span>` : ""}${m.third ? "<span>3rd place</span>" : ""}${pill}${focusCls === "focus" ? `<button class="fs-btn" data-mv="${id}">Match view</button>` : ""}${playable ? `<button class="edit" data-m="${id}" aria-label="Edit match M${ctx.num[id]}">Edit</button>` : ""}</div>`;
  const slot = side => {
    const v = side ? o.B : o.A;
    if (v === BYE) return `<div class="slot byeslot"><span class="sd"></span><span class="nm">Bye</span><span></span></div>`;
    if (v == null || o.status === "skip") return `<div class="slot tbd"><span class="sd"></span><span class="nm">${v == null ? esc(slotLabel(m, side, ctx)) : esc(teamName(v))}</span><span></span></div>`;
    const sc = o.r && o.r.s ? o.r.s[side] : "";
    const state = o.status === "done" ? (o.winner === v ? "win" : "lose") : "";
    if (o.status === "bye") return `<div class="slot"><span class="sd">${seedOf(T, v)}</span><span class="nm">${esc(teamName(v))}</span><span class="sc"></span></div>`;
    return `<button class="slot ${state}" data-m="${id}" data-side="${side}" aria-label="${esc(teamName(v))}${state === "win" ? ", winner" : ""}"><span class="sd">${seedOf(T, v)}</span><span class="nm">${esc(teamName(v))}</span><span class="sc">${sc}</span></button>`;
  };
  return `<div class="${cls}" data-id="${id}" style="${style}">${head}${slot(0)}${slot(1)}</div>`;
}

function layoutRounds(rounds, yBase, pos, colOf = ri => ri) {
  let maxY = yBase;
  rounds.forEach((ids, ri) => ids.forEach((id, i) => {
    const m = getM(id);
    const fs = [m.a, m.b].filter(s => s && s.t === "W" && pos[s.m]).map(s => pos[s.m].y);
    const y = fs.length ? fs.reduce((a, b) => a + b, 0) / fs.length : yBase + HEAD + i * SLOT;
    pos[id] = { x: colOf(ri) * (CW + GAP), y };
    maxY = Math.max(maxY, y);
  }));
  return maxY;
}
const colHeads = (br, rounds, y) => rounds.map((_, i) => ({ x: i * (CW + GAP), y, text: roundName(br, i, rounds.length) }));

// where a match's teams come from: winners (W), losers dropping down (L), or the grand final before a reset
function sourcesOf(m) {
  const s = [];
  if (m.cond === "reset") s.push({ t: "W", m: m.ref });
  [m.a, m.b].forEach(x => { if (x && (x.t === "W" || x.t === "L")) s.push(x); });
  return s;
}
function relatedTo(id) {
  const rel = new Set(sourcesOf(getM(id)).map(s => s.m));
  T.matches.forEach(m => { if (sourcesOf(m).some(s => s.m === id)) rel.add(m.id); });
  return rel;
}

/* board layouts: positions, column heads and size, shared by the page and the image export */
function seLayout(br, thirdId) {
  const pos = {}, rounds = roundsOf(br), R = rounds.length;
  let maxY, heads, cols;
  if (T.layout === "center" && R >= 2) {
    // two half brackets feeding a final in the middle column
    const half = side => rounds.slice(0, R - 1).map(ids => side ? ids.slice(ids.length / 2) : ids.slice(0, ids.length / 2));
    maxY = Math.max(layoutRounds(half(0), 0, pos), layoutRounds(half(1), 0, pos, ri => 2 * R - 2 - ri));
    const finId = rounds[R - 1][0], semis = rounds[R - 2];
    pos[finId] = { x: (R - 1) * (CW + GAP), y: (pos[semis[0]].y + pos[semis[1]].y) / 2 };
    heads = [];
    for (let ri = 0; ri < R - 1; ri++) {
      const text = roundName(br, ri, R);
      heads.push({ x: ri * (CW + GAP), y: 0, text }, { x: (2 * R - 2 - ri) * (CW + GAP), y: 0, text });
    }
    heads.push({ x: pos[finId].x, y: 0, text: "Final" });
    cols = 2 * R - 1;
  } else {
    maxY = layoutRounds(rounds, 0, pos);
    heads = colHeads(br, rounds, 0);
    cols = R;
  }
  if (thirdId) {
    const fin = pos[rounds[R - 1][0]];
    pos[thirdId] = { x: fin.x, y: fin.y + CH + 56 };
    heads.push({ x: fin.x, y: fin.y + CH + 32, text: "3rd place" });
    maxY = Math.max(maxY, pos[thirdId].y);
  }
  return { key: br, pos, heads, width: cols * (CW + GAP) - GAP, height: maxY + CH + 8, divider: null };
}

function deLayout() {
  const pos = {}, wr = roundsOf("W"), lr = roundsOf("L");
  const wbMax = layoutRounds(wr, 0, pos);
  const heads = colHeads("W", wr, 0);
  const lbTop = wbMax + CH + 56;
  let maxY = wbMax;
  if (lr.length) {
    maxY = layoutRounds(lr, lbTop, pos);
    heads.push(...colHeads("L", lr, lbTop));
  }
  const fc = Math.max(wr.length, lr.length);
  const wf = pos[wr[wr.length - 1][0]].y;
  const gy = lr.length ? (wf + pos[lr[lr.length - 1][0]].y) / 2 : wf;
  pos[T.gf] = { x: fc * (CW + GAP), y: gy };
  heads.push({ x: pos[T.gf].x, y: gy - 24, text: "Grand final" });
  if (T.gfReset) {
    pos[T.gfReset] = { x: (fc + 1) * (CW + GAP), y: gy };
    heads.push({ x: pos[T.gfReset].x, y: gy - 24, text: "Reset · if needed" });
  }
  return {
    key: "DE", pos, heads,
    width: (fc + (T.gfReset ? 2 : 1)) * (CW + GAP) - GAP, height: Math.max(maxY, gy) + CH + 8,
    divider: lr.length ? { y: lbTop - 18, w: lr.length * (CW + GAP) - GAP } : null,
  };
}

// connector lines; drop-down lines (losers into the losers bracket) only appear for a highlighted match
function wiresOf(L, ctx, focus) {
  const res = [];
  Object.keys(L.pos).forEach(id => {
    const p = L.pos[id];
    sourcesOf(getM(id)).forEach(s => {
      const f = L.pos[s.m];
      if (!f) return;
      const linked = !!focus && (id === focus || s.m === focus);
      if (s.t === "L" && !linked) return;
      const fo = ctx.out[s.m], y1 = f.y + CH / 2, y2 = p.y + CH / 2;
      let pts;
      if (f.x > p.x) pts = [[f.x, y1], [f.x - GAP / 2, y1], [f.x - GAP / 2, y2], [p.x + CW, y2]]; // right half feeds leftward
      else if (p.x >= f.x + CW + 12) pts = [[f.x + CW, y1], [f.x + CW + GAP / 2, y1], [f.x + CW + GAP / 2, y2], [p.x, y2]];
      else { const ex = p.x + CW, mx = Math.max(f.x + CW, ex) + GAP / 2; pts = [[f.x + CW, y1], [mx, y1], [mx, y2], [ex, y2]]; } // same column: enter from the right
      res.push({ pts, lit: fo.status === "done" && s.t === "W", faint: fo.status === "bye", drop: s.t === "L", linked, dim: !!focus && !linked });
    });
  });
  return res;
}

function drawBoard(L, ctx) {
  const focus = ui.focus && L.pos[ui.focus] ? ui.focus : null;
  const rel = focus ? relatedTo(focus) : null;
  const wires = wiresOf(L, ctx, focus).sort((a, b) => a.linked - b.linked).map(w => {
    const cls = [w.lit ? "lit" : "", w.faint ? "faint" : "", w.drop ? "drop" : "", w.linked ? "focus" : "", w.dim ? "dim" : ""].filter(Boolean).join(" ");
    return `<path class="${cls}" d="M${w.pts.map(p => p.join(" ")).join("L")}"/>`;
  }).join("");
  const divider = L.divider ? `<path class="divider" d="M0 ${L.divider.y}H${L.divider.w}"/>` : "";
  const headHtml = L.heads.map(h => `<div class="col-head" style="left:${h.x}px;top:${h.y}px">${esc(h.text)}</div>`).join("");
  const cards = Object.keys(L.pos).map(id => {
    const fc = focus ? (id === focus ? "focus" : rel.has(id) ? "rel" : "dim") : "";
    return matchCard(id, ctx, `left:${L.pos[id].x}px;top:${L.pos[id].y}px`, fc);
  }).join("");
  return `<div class="scroll" data-k="${L.key}"><div class="elim" data-w="${L.width}" style="width:${L.width}px;height:${L.height}px">
    <svg class="wires" width="${L.width}" height="${L.height}">${divider}${wires}</svg>${headHtml}${cards}</div></div>`;
}
const seBoard = (br, ctx, thirdId) => drawBoard(seLayout(br, thirdId), ctx);
const deBoard = ctx => drawBoard(deLayout(), ctx);

/* ---------- image export: repaint the bracket onto a canvas ---------- */
async function exportImage() {
  const { out } = compute(T);
  const num = {}; let n = 0;
  T.matches.forEach(m => { if (out[m.id].status !== "bye") num[m.id] = ++n; });
  const ctx = { out, num };
  const css = getComputedStyle(document.documentElement), v = k => css.getPropertyValue(k).trim();
  const C = { bg: v("--bg"), surface: v("--surface"), s2: v("--surface-2"), line: v("--line"), strong: v("--line-strong"), fg: v("--fg"), muted: v("--muted"), win: v("--win"), winSoft: v("--win-soft") };
  const F = { display: '"Barlow Condensed", "Arial Narrow", sans-serif', body: 'Barlow, system-ui, sans-serif', mono: '"IBM Plex Mono", Consolas, monospace' };
  try { await document.fonts.ready; } catch (e) {}

  const blocks = [], all = T.teams.map(x => x.id);
  const board = (title, L) => blocks.push({ title, w: L.width, h: L.height, draw: (g, x, y) => paintBoard(g, L, ctx, x, y, C, F) });
  const table = (title, ids, ms, adv) => {
    const st = standings(T, ids, ms, out), w = 560;
    blocks.push({ title, w, h: 36 + st.length * 32, draw: (g, x, y) => paintTable(g, st, x, y, w, adv, C, F) });
  };
  if (T.style === "se") board("Bracket", seLayout("W", T.thirdId));
  else if (T.style === "de") board("Bracket", deLayout());
  else if (T.style === "rr") table("Standings", all, T.matches);
  else if (T.style === "sw") table("Standings", all, T.matches.filter(m => m.br === "S"));
  else if (T.style === "gp") {
    T.groups.forEach((g, gi) => table(`Group ${String.fromCharCode(65 + gi)}`, g, T.matches.filter(m => m.br === "G" + gi), T.opts.advance));
    if (T.matches.some(m => m.br === "P")) board("Playoffs", seLayout("P", T.thirdId));
  }

  const PAD = 56, HEADER = 190;
  const W = Math.max(960, ...blocks.map(b => b.w)) + PAD * 2;
  const H = PAD + HEADER + blocks.reduce((a, b) => a + 44 + b.h + 36, 0) + 30 + PAD;
  const scale = W * H * 4 < 120e6 ? 2 : 1;
  const cv = document.createElement("canvas");
  cv.width = W * scale; cv.height = H * scale;
  const g = cv.getContext("2d");
  g.scale(scale, scale);
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  g.textBaseline = "middle";

  // header: what, who won
  const pod = podium(out);
  const real = T.matches.filter(m => !["bye", "skip"].includes(out[m.id].status));
  const played = real.filter(m => out[m.id].status === "done").length;
  let y = PAD;
  g.fillStyle = C.muted; g.font = `600 14px ${F.body}`;
  spaced(g, `${STYLES[T.style].name} · ${T.teams.length} teams · ${new Date().toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" })}`.toUpperCase(), PAD, y + 8, 1.4);
  g.fillStyle = C.fg; g.font = `700 52px ${F.display}`;
  g.fillText(T.name, PAD, y + 50);
  y += 96;
  if (pod[0]) {
    g.font = `600 14px ${F.body}`; g.fillStyle = C.win; spaced(g, "CHAMPION", PAD, y + 4, 1.4);
    g.font = `700 34px ${F.display}`; g.fillStyle = C.fg; g.fillText(teamName(pod[0]), PAD, y + 30);
    let px = PAD + g.measureText(teamName(pod[0])).width + 40;
    g.font = `500 18px ${F.body}`;
    [[pod[1], "2nd"], [pod[2], "3rd"]].forEach(([id, lab]) => {
      if (!id) return;
      g.fillStyle = C.muted; g.fillText(lab, px, y + 32); px += g.measureText(lab).width + 8;
      g.fillStyle = C.fg; g.font = `600 18px ${F.body}`; g.fillText(teamName(id), px, y + 32); px += g.measureText(teamName(id)).width + 28;
      g.font = `500 18px ${F.body}`;
    });
  } else {
    g.font = `500 18px ${F.body}`; g.fillStyle = C.muted;
    g.fillText(`In progress · ${played} of ${real.length} matches played`, PAD, y + 20);
  }
  y = PAD + HEADER;

  blocks.forEach(b => {
    g.fillStyle = C.fg; g.font = `700 26px ${F.display}`; g.fillText(b.title, PAD, y + 14);
    y += 44;
    b.draw(g, PAD, y);
    y += b.h + 36;
  });
  g.fillStyle = C.muted; g.font = `500 12px ${F.body}`; g.fillText("Made with Bout Board", PAD, H - PAD + 10);

  const blob = await new Promise(r => cv.toBlob(r, "image/png"));
  const filename = slug(T.name) + (pod[0] ? "-results" : "-bracket") + ".png";
  await saveFile(filename, blob, () => {
    const url = cv.toDataURL("image/png");
    openModal(`<h2>Bracket image</h2><p>Right-click the image (or press and hold on a phone) to save it.</p>
      <div style="overflow:auto;max-height:60vh;border:1px solid var(--line);border-radius:8px"><img src="${url}" alt="Bracket for ${esc(T.name)}" style="display:block;max-width:100%"></div>
      <div class="acts"><button class="btn primary" id="im-close">Done</button></div>`, (dlg, close) => { $("#im-close", dlg).onclick = close; });
  });
}
function spaced(g, text, x, y, sp) {
  if ("letterSpacing" in g) { g.letterSpacing = sp + "px"; g.fillText(text, x, y); g.letterSpacing = "0px"; }
  else g.fillText(text, x, y);
}
function fitText(g, text, maxW) {
  if (g.measureText(text).width <= maxW) return text;
  let s = text;
  while (s.length > 1 && g.measureText(s + "…").width > maxW) s = s.slice(0, -1);
  return s + "…";
}
function rr(g, x, y, w, h, r) { g.beginPath(); if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h); }

function paintBoard(g, L, ctx, ox, oy, C, F) {
  g.save(); g.translate(ox, oy);
  if (L.divider) { g.strokeStyle = C.line; g.setLineDash([2, 6]); g.lineWidth = 1.5; g.beginPath(); g.moveTo(0, L.divider.y); g.lineTo(L.divider.w, L.divider.y); g.stroke(); g.setLineDash([]); }
  wiresOf(L, ctx, null).forEach(w => {
    g.strokeStyle = w.lit ? C.win : C.strong; g.lineWidth = w.lit ? 2 : 1.5;
    g.globalAlpha = w.faint ? .6 : 1; g.setLineDash(w.faint ? [3, 4] : []);
    g.beginPath(); w.pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke();
  });
  g.globalAlpha = 1; g.setLineDash([]);
  g.fillStyle = C.muted; g.font = `600 12px ${F.body}`;
  L.heads.forEach(h => spaced(g, h.text.toUpperCase(), h.x, h.y + 8, 1.2));
  Object.keys(L.pos).forEach(id => paintCard(g, id, L.pos[id].x, L.pos[id].y, ctx, C, F));
  g.restore();
}

function paintCard(g, id, x, y, ctx, C, F) {
  const m = getM(id), o = ctx.out[id], ghost = o.status === "bye" || o.status === "skip";
  const bo = boOf(m);
  g.save();
  g.globalAlpha = ghost ? .5 : 1;
  rr(g, x, y, CW, CH, 8);
  if (!ghost) { g.fillStyle = C.surface; g.fill(); }
  g.save(); g.clip();
  if (!ghost) { g.fillStyle = C.s2; g.fillRect(x, y, CW, 22); }
  const rowY = side => y + 22 + side * 35;
  [0, 1].forEach(side => {
    const v = side ? o.B : o.A;
    if (o.status === "done" && v === o.winner) { g.fillStyle = C.winSoft; g.fillRect(x, rowY(side), CW, 35); }
  });
  g.restore();
  g.strokeStyle = C.line; g.lineWidth = 1;
  g.beginPath(); g.moveTo(x, y + 22.5); g.lineTo(x + CW, y + 22.5); g.moveTo(x, y + 57.5); g.lineTo(x + CW, y + 57.5); g.stroke();
  g.setLineDash(ghost ? [4, 4] : []); g.strokeStyle = C.strong; rr(g, x + .5, y + .5, CW - 1, CH - 1, 8); g.stroke(); g.setLineDash([]);
  // header
  g.font = `600 11.5px ${F.mono}`; g.fillStyle = C.fg; g.textAlign = "left";
  const label = o.status === "bye" ? "Bye" : o.status === "skip" ? "Not needed" : "M" + ctx.num[id];
  g.fillText(label, x + 8, y + 11.5);
  g.fillStyle = C.muted; g.font = `500 11.5px ${F.mono}`;
  let hx = x + 8 + g.measureText(label).width + 10;
  if (!ghost && bo > 1) { g.fillText(`Bo${bo}`, hx, y + 11.5); hx += 40; }
  if (m.third) g.fillText("3rd place", hx, y + 11.5);
  // rows
  [0, 1].forEach(side => {
    const v = side ? o.B : o.A, cy = rowY(side) + 17.5;
    if (v == null || v === BYE || o.status === "skip") {
      g.fillStyle = C.muted; g.font = `italic 500 13.5px ${F.body}`;
      g.fillText(fitText(g, v === BYE ? "Bye" : v == null ? slotLabel(m, side, ctx) : teamName(v), CW - 46), x + 32, cy);
      return;
    }
    const won = o.status === "done" && v === o.winner, lost = o.status === "done" && v !== o.winner;
    g.textAlign = "right"; g.fillStyle = C.muted; g.font = `500 11.5px ${F.mono}`;
    g.fillText(String(seedOf(T, v)), x + 26, cy);
    const sc = o.r && o.r.s ? String(o.r.s[side]) : "";
    g.font = `600 14px ${F.mono}`; g.fillStyle = won ? C.win : lost ? C.muted : C.fg;
    if (sc) g.fillText(sc, x + CW - 10, cy);
    g.textAlign = "left";
    g.font = `${lost ? 500 : 600} 15px ${F.body}`; g.fillStyle = lost ? C.muted : C.fg;
    const name = fitText(g, teamName(v), CW - 32 - 40 - (won ? 16 : 0));
    g.fillText(name, x + 32, cy);
    if (won) { const w = g.measureText(name).width; g.fillStyle = C.win; g.fillText("✓", x + 32 + w + 5, cy); }
  });
  g.restore();
}

function paintTable(g, st, x, y, w, adv, C, F) {
  const cols = [["P", w - 230], ["W", w - 175], ["L", w - 120], ["Pts", w - 24]];
  g.save();
  rr(g, x, y, w, 36 + st.length * 32, 10); g.fillStyle = C.surface; g.fill();
  g.save(); g.clip();
  g.fillStyle = C.s2; g.fillRect(x, y, w, 36);
  st.forEach((r, i) => { if (adv && i < adv) { g.fillStyle = C.winSoft; g.fillRect(x, y + 36 + i * 32, w, 32); } });
  g.restore();
  g.strokeStyle = C.line; g.lineWidth = 1;
  for (let i = 0; i <= st.length; i++) { g.beginPath(); g.moveTo(x, y + 36 + i * 32 - .5); g.lineTo(x + w, y + 36 + i * 32 - .5); if (i < st.length) g.stroke(); }
  rr(g, x + .5, y + .5, w - 1, 36 + st.length * 32 - 1, 10); g.stroke();
  g.fillStyle = C.muted; g.font = `600 11.5px ${F.body}`;
  g.textAlign = "left"; spaced(g, "#", x + 16, y + 18, 1); spaced(g, "TEAM", x + 52, y + 18, 1);
  g.textAlign = "right"; cols.forEach(([h, cx]) => spaced(g, h.toUpperCase(), x + cx, y + 18, 1));
  st.forEach((r, i) => {
    const cy = y + 36 + i * 32 + 16;
    g.textAlign = "left"; g.fillStyle = C.muted; g.font = `500 13.5px ${F.mono}`; g.fillText(String(i + 1), x + 16, cy);
    g.fillStyle = C.fg; g.font = `600 15px ${F.body}`; g.fillText(fitText(g, teamName(r.id), w - 52 - 250), x + 52, cy);
    g.textAlign = "right"; g.font = `500 13.5px ${F.mono}`;
    [r.p, r.w, r.l].forEach((val, k) => g.fillText(String(val), x + cols[k][1], cy));
    g.font = `600 13.5px ${F.mono}`; g.fillText(String(r.pts), x + cols[3][1], cy);
  });
  g.textAlign = "left";
  g.restore();
}

function matchLabel(m) {
  if (m.br === "3") return "3rd place";
  if (m.br === "F") return m.rd === 1 ? "Grand final" : "Grand final reset";
  if (m.br === "W" || m.br === "L" || m.br === "P") return roundName(m.br, m.rd - 1, roundsOf(m.br).length);
  if (m.br[0] === "G") return `Group ${String.fromCharCode(65 + +m.br.slice(1))} · Round ${m.rd}`;
  return `Round ${m.rd}`;
}

/* ---------- match view: one match, full screen ---------- */
let mvTimer = null, mvFs = false;
const MV_DELAY = 4000;
function viewableIds(out) { return T.matches.filter(m => ["ready", "live", "done"].includes(out[m.id].status)).map(m => m.id); }
function openMatchView(id) {
  ui.mv = id; ui.mvStay = false; ui.mvArm = false;
  const el = document.documentElement;
  if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().then(() => { mvFs = true; }).catch(() => {});
  render();
}
function gotoView(id) { clearTimeout(mvTimer); mvTimer = null; ui.mv = id; ui.mvStay = false; ui.mvArm = false; render(); }
function closeMatchView() {
  clearTimeout(mvTimer); mvTimer = null; ui.focus = ui.mv; ui.mv = null;
  if (mvFs && document.fullscreenElement) document.exitFullscreen().catch(() => {});
  mvFs = false; render();
}
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement) mvFs = false; });

function renderMatchView(ctx, pod) {
  const root = $("#mv-root");
  const m = ui.mv && T && view === "board" ? getM(ui.mv) : null;
  if (!m) { root.innerHTML = ""; document.body.classList.remove("mv-open"); clearTimeout(mvTimer); mvTimer = null; ui.mv = null; return; }
  document.body.classList.add("mv-open");
  const { out, num, nextId } = ctx, id = m.id, o = out[id], bo = boOf(m), need = Math.ceil(bo / 2);
  if (o.status !== "done") ui.mvArm = true; // only auto-advance when the result lands while we're watching
  const list = viewableIds(out), idx = list.indexOf(id);
  const prev = idx > 0 ? list[idx - 1] : null, next = idx >= 0 && idx < list.length - 1 ? list[idx + 1] : null;
  const playable = ["ready", "live", "done"].includes(o.status);

  const team = side => {
    const v = side ? o.B : o.A;
    if (v == null || v === BYE) return `<div class="mv-team tbd"><span class="mv-name">${v === BYE ? "Bye" : esc(slotLabel(m, side, ctx))}</span></div>`;
    const sc = o.r && o.r.s ? o.r.s[side] : 0;
    const state = o.status === "done" ? (o.winner === v ? "win" : "lose") : "";
    const pips = bo > 1 ? `<span class="mv-pips" aria-label="${sc} of ${need} rounds">${Array.from({ length: need }, (_, i) => `<i class="${i < sc ? "on" : ""}"></i>`).join("")}</span>` : "";
    const score = bo > 1 || (o.r && o.r.s) ? `<span class="mv-score">${sc}</span>` : "";
    return `<button class="mv-team ${state}" data-side="${side}" ${playable ? "" : "disabled"}>
      <span class="mv-seed">Seed ${seedOf(T, v)}</span><span class="mv-name">${esc(teamName(v))}</span>${score}${pips}
      ${state === "win" ? `<span class="mv-tag">Winner</span>` : ""}</button>`;
  };

  let banner = "";
  const autoGo = o.status === "done" && ui.mvArm && !ui.mvStay && nextId;
  if (o.status === "done") {
    const w = esc(teamName(o.winner));
    if (autoGo) banner = `<div class="mv-banner"><span><b>${w}</b> wins. Next match in a moment.</span><span class="mv-acts"><button class="btn" id="mv-stay">Stay here</button><button class="btn primary" id="mv-go">Next match now</button></span><i class="mv-count" style="animation-duration:${MV_DELAY}ms"></i></div>`;
    else if (pod[0] && !nextId) banner = `<div class="mv-banner champ"><span>Champion: <b>${esc(teamName(pod[0]))}</b></span></div>`;
    else if (!nextId && T.style === "sw" && T.swissRound < T.opts.rounds) banner = `<div class="mv-banner"><span>Round ${T.swissRound} is complete.</span><span class="mv-acts"><button class="btn primary" id="mv-pair">Pair round ${T.swissRound + 1}</button></span></div>`;
    else if (nextId) banner = `<div class="mv-banner"><span><b>${w}</b> wins.</span><span class="mv-acts"><button class="btn primary" id="mv-go">Go to next match</button></span></div>`;
  }

  root.innerHTML = `<div class="mv" role="dialog" aria-label="Match view">
    <div class="mv-top">
      <div><p class="eyebrow">${esc(T.name)}</p><h2>${esc(matchLabel(m))} · M${num[id] || "–"}${bo > 1 ? `<small>Best of ${bo}, first to ${need}</small>` : ""}</h2></div>
      <div class="mv-nav">
        <button class="btn" id="mv-prev" ${prev ? "" : "disabled"} aria-label="Previous match">← Prev</button>
        <button class="btn" id="mv-next" ${next ? "" : "disabled"} aria-label="Next match">Next →</button>
        ${playable ? `<button class="btn" id="mv-edit">Edit score</button>` : ""}
        <button class="btn primary" id="mv-exit">Exit</button>
      </div>
    </div>
    <div class="mv-stage">${team(0)}<div class="mv-vs">vs</div>${team(1)}</div>
    ${banner}
    <p class="mv-hint">Click a team to give them ${bo > 1 ? "the round" : "the win"}. Click the winner again to undo. Keys: ← → change match, Esc exits.</p>
  </div>`;

  root.querySelectorAll(".mv-team[data-side]").forEach(b => b.onclick = () => clickSlot(id, +b.dataset.side));
  const on = (sel, fn) => { const b = $(sel, root); if (b) b.onclick = fn; };
  on("#mv-prev", () => gotoView(prev));
  on("#mv-next", () => gotoView(next));
  on("#mv-edit", () => editMatch(id));
  on("#mv-exit", closeMatchView);
  on("#mv-stay", () => { ui.mvStay = true; clearTimeout(mvTimer); mvTimer = null; render(); });
  on("#mv-go", () => gotoView(nextId));
  on("#mv-pair", () => { pairSwiss(); const c = compute(T).out; const first = viewableIds(c).find(x => c[x].status !== "done"); if (first) gotoView(first); });

  if (autoGo) {
    if (!mvTimer) mvTimer = setTimeout(() => {
      mvTimer = null;
      if (ui.mv !== id) return;
      const c = compute(T).out;
      const target = T.matches.find(x => ["ready", "live"].includes(c[x.id].status));
      if (target) gotoView(target.id);
    }, MV_DELAY);
  } else { clearTimeout(mvTimer); mvTimer = null; }
}

function flowRounds(rounds, ctx, extraFn) {
  const w = rounds.length * (CW + 18);
  return `<div class="scroll" data-k="flow-${rounds[0] && rounds[0][0]}"><div class="rounds" data-w="${w}">` + rounds.map((ids, r) => `
    <div class="round-col"><h3>${rounds.length > 1 || T.style !== "de" ? (T.style === "de" ? "" : "Round " + (T.style === "sw" ? getM(ids[0]).rd : r + 1)) : ""}</h3>
      ${ids.map(id => matchCard(id, ctx)).join("")}${extraFn(r)}</div>`).join("") + `</div></div>`;
}

function standingsTable(ids, ms, out, advance) {
  const st = standings(T, ids, ms, out);
  const anyScore = ms.some(m => out[m.id] && out[m.id].r && out[m.id].r.s);
  const swiss = T.style === "sw";
  const showPts = (T.opts.ptsWin || 1) !== 1;
  return `<div class="std-wrap"><table class="std"><thead><tr><th>#</th><th class="tm">Team</th><th title="Played">P</th><th title="Wins">W</th><th title="Losses">L</th>${anyScore ? '<th title="Score difference">+/−</th>' : ""}${swiss ? '<th title="Buchholz: total wins of opponents faced">Opp W</th>' : ""}<th>Pts</th></tr></thead><tbody>` +
    st.map((r, i) => `<tr class="${advance && i < advance ? "adv" : ""}"><td class="rk">${i + 1}</td><td class="tm">${esc(teamName(r.id))}</td><td>${r.p}</td><td>${r.w}</td><td>${r.l}</td>${anyScore ? `<td>${r.diff > 0 ? "+" : ""}${r.diff}</td>` : ""}${swiss ? `<td>${r.bh}</td>` : ""}<td class="pts">${r.pts}</td></tr>`).join("") +
    `</tbody></table></div><p class="std-note">${swiss ? "Ties break by opponents' wins, then score difference, then seed." : "Ties break by head-to-head, then score difference, then seed."}${showPts ? "" : ""}${advance ? " Shaded rows advance." : ""}</p>`;
}

/* ---------- top actions ---------- */
$("#tab-setup").onclick = () => { view = "setup"; render(); };
$("#tab-board").onclick = () => { if (T) { view = "board"; render(); } };
$("#btn-reset").onclick = async () => {
  if (!T) return;
  const ok = await confirmBox("Reset all results?", `Every result in “${T.name}” will be cleared. Teams and the bracket stay the same.`, "Reset results");
  if (!ok) return;
  T.results = {};
  if (T.style === "sw") { T.matches = T.matches.filter(m => m.rd === 1); T.swissRound = 1; }
  saveT(); render(); toast("Results cleared.");
};
function exportData() {
  const tt = Object.assign({}, T); delete tt._seed;
  return JSON.stringify({ app: "bout-board", v: 1, exported: new Date().toISOString(), tournament: tt, draft }, null, 2);
}
const slug = s => s.replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-").toLowerCase() || "tournament";
// Claude's save prompt when hosted there, a normal download when opened as a local file, otherwise the fallback
async function saveFile(filename, data, fallback) {
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if (dl) {
      try { await dl.save({ filename, data }); toast("Saved " + filename); return; }
      catch (e) { if (e && e.code === "declined") return; }
    }
  } catch (e) {}
  if (!window.claude) {
    try {
      const blob = data instanceof Blob ? data : new Blob([data], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000); toast("Saved " + filename); return;
    } catch (e) {}
  }
  fallback();
}
$("#btn-export").onclick = async () => {
  if (!T) return;
  const json = exportData();
  await saveFile(slug(T.name) + ".json", json, () => openModal(`<h2>Export tournament</h2><p>Copy this JSON and keep it somewhere safe. Use Import on another device to load it.</p>
    <textarea class="json" id="ex-json" readonly>${esc(json)}</textarea>
    <div class="acts"><button class="btn" id="ex-close">Close</button><button class="btn primary" id="ex-copy">Copy</button></div>`,
    (dlg, close) => {
      $("#ex-close", dlg).onclick = close;
      $("#ex-copy", dlg).onclick = () => {
        const ta = $("#ex-json", dlg);
        navigator.clipboard.writeText(json).then(() => toast("Copied."), () => { ta.select(); toast("Press Ctrl+C to copy."); });
      };
    }));
};
$("#btn-import").onclick = () => {
  openModal(`<h2>Import tournament</h2><p>Choose an exported .json file, or paste its contents. This replaces the current bracket.</p>
    <button class="btn" id="im-file">Choose file…</button>
    <textarea class="json" id="im-json" placeholder="Or paste JSON here"></textarea>
    <div class="acts"><button class="btn" id="im-cancel">Cancel</button><button class="btn primary" id="im-go">Import pasted JSON</button></div>`,
    (dlg, close) => {
      $("#im-cancel", dlg).onclick = close;
      $("#im-file", dlg).onclick = () => { close(); $("#import-file").click(); };
      $("#im-go", dlg).onclick = () => { const txt = $("#im-json", dlg).value; close(); importText(txt); };
    });
};
$("#import-file").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => importText(String(rd.result));
  rd.readAsText(f); e.target.value = "";
};
async function importText(txt) {
  let data;
  try { data = JSON.parse(txt); } catch (e) { toast("That file isn't valid JSON."); return; }
  const t = data && data.tournament;
  if (!t || !Array.isArray(t.matches) || !Array.isArray(t.teams)) { toast("That JSON isn't a Bout Board export."); return; }
  if (T) {
    const ok = await confirmBox("Replace the current bracket?", `Importing “${t.name}” replaces “${T.name}”.`, "Import and replace");
    if (!ok) return;
  }
  delete t._seed;
  T = t; if (data.draft) draft = Object.assign(defaultDraft(), data.draft);
  saveT(); saveDraft(); view = "board"; render(); toast(`Imported “${T.name}”.`);
}

render();
</script>
