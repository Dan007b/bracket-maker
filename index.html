<meta charset="utf-8">
<title>Bout Board</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: slim top bar with Setup / Bracket tabs. Setup is a two-column form; the bracket is a scoreboard of round columns that scrolls sideways and zooms for a projector. */
:root {
  --bg: #eceff4;
  --surface: #ffffff;
  --surface-2: #f5f7fa;
  --line: #d3d9e3;
  --line-strong: #aeb8c8;
  --fg: #121a26;
  --muted: #5b6779;
  --accent: #2443c4;
  --accent-fg: #ffffff;
  --accent-soft: #e2e7fb;
  --win: #127547;
  --win-soft: #daf1e4;
  --next: #a86100;
  --next-soft: #fdefd6;
  --danger: #b42318;
  --danger-soft: #fde4e1;
  --shadow: 0 1px 2px rgba(18, 26, 38, .06), 0 2px 8px rgba(18, 26, 38, .05);
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c121b; --surface: #151d29; --surface-2: #1b2534; --line: #2a374b; --line-strong: #44546d;
    --fg: #e7ecf4; --muted: #95a2b6; --accent: #7f99ff; --accent-fg: #0c121b; --accent-soft: #1d2950;
    --win: #4bcb8d; --win-soft: #12342a; --next: #f3ab3f; --next-soft: #392a12; --danger: #ff8073; --danger-soft: #3b1a17;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c121b; --surface: #151d29; --surface-2: #1b2534; --line: #2a374b; --line-strong: #44546d;
  --fg: #e7ecf4; --muted: #95a2b6; --accent: #7f99ff; --accent-fg: #0c121b; --accent-soft: #1d2950;
  --win: #4bcb8d; --win-soft: #12342a; --next: #f3ab3f; --next-soft: #392a12; --danger: #ff8073; --danger-soft: #3b1a17;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.45; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: .01em; text-wrap: balance; margin: 0; }

/* ---------- top bar ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .02em; }
.brand svg { width: 28px; height: 28px; }
.tabs { display: flex; gap: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
.tabs button { border: 0; background: transparent; padding: 5px 14px; border-radius: 6px; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.tabs button:disabled { opacity: .45; cursor: not-allowed; }
.top-actions { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--line-strong); background: var(--surface); padding: 6px 12px; border-radius: 7px; font-weight: 600; font-size: 14px;
}
.btn:hover { border-color: var(--fg); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); }
.btn.danger:hover { border-color: var(--danger); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.big { padding: 10px 20px; font-size: 16px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

main { padding-inline: 16px; padding-block: 20px 60px; max-width: 1500px; margin: 0 auto; }

/* ---------- setup ---------- */
.setup { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .setup { grid-template-columns: minmax(0, 1fr); } }
.col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel h2 { font-size: 22px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.hint { color: var(--muted); font-size: 13.5px; margin: 0; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span, .label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
input[type="text"], input[type="number"], select {
  border: 1px solid var(--line-strong); background: var(--surface); border-radius: 7px; padding: 8px 10px; min-width: 0; width: 100%;
}
input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.ev-name { font-family: var(--display); font-size: 24px; font-weight: 600; }

.count { display: flex; align-items: center; gap: 0; }
.count button { width: 36px; height: 36px; border: 1px solid var(--line-strong); background: var(--surface-2); font-size: 18px; font-weight: 600; }
.count button:first-child { border-radius: 7px 0 0 7px; }
.count button:last-child { border-radius: 0 7px 7px 0; }
.count input { width: 64px; height: 36px; text-align: center; border-radius: 0; border-left: 0; border-right: 0; font-family: var(--mono); font-weight: 600; }
.team-tools { display: flex; gap: 8px; flex-wrap: wrap; }
.team-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; max-height: 520px; overflow-y: auto; padding-right: 4px; }
.team-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) 32px; gap: 6px; align-items: center; }
.team-row .seed { font-family: var(--mono); font-size: 13px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.team-row input { padding: 6px 10px; }
.team-row .x { width: 32px; height: 32px; border: 0; background: transparent; color: var(--muted); border-radius: 6px; font-size: 18px; line-height: 1; }
.team-row .x:hover { background: var(--danger-soft); color: var(--danger); }
.example-note { font-size: 13px; color: var(--next); background: var(--next-soft); border-radius: 6px; padding: 6px 10px; margin: 0; }

.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 7px 14px; font-weight: 600; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.row { display: flex; gap: 16px 24px; flex-wrap: wrap; align-items: flex-end; }

.style-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 10px; }
.style-card {
  text-align: left; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 9px; padding: 12px 14px;
  display: flex; flex-direction: column; gap: 6px; min-height: 100%;
}
.style-card:hover { border-color: var(--fg); }
.style-card[aria-checked="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.style-card .sc-top { display: flex; align-items: center; gap: 10px; }
.style-card svg { width: 42px; height: 26px; flex: none; color: var(--accent); }
.style-card strong { font-family: var(--display); font-size: 19px; font-weight: 700; line-height: 1.1; }
.style-card p { margin: 0; font-size: 13.5px; color: var(--muted); }
.style-card .meta { font-family: var(--mono); font-size: 12px; color: var(--fg); margin-top: auto; font-variant-numeric: tabular-nums; }
.opts { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: flex-end; padding-top: 4px; border-top: 1px dashed var(--line); }
.opts .field { width: 150px; }
.opts .field:has(.seg) { width: auto; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 14.5px; max-width: 46ch; }
.check input { margin-top: 3px; accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
.check small { display: block; color: var(--muted); font-size: 13px; }

.start-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; }
.start-bar .sum { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.start-bar .sum b { color: var(--fg); }
.start-bar .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.warn { font-size: 13.5px; color: var(--next); margin: 0; flex-basis: 100%; }

/* ---------- board ---------- */
.board-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.eyebrow { margin: 0 0 2px; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.board-head h1 { font-size: clamp(28px, 4vw, 44px); line-height: 1; }
.progress { min-width: 200px; font-family: var(--mono); font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--win); }

.callouts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 12px; margin-bottom: 14px; }
.callout { border-radius: 10px; padding: 12px 16px; border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 4px; text-align: left; }
button.callout:hover { border-color: var(--fg); }
.callout .label { color: var(--muted); }
.callout .vs { font-family: var(--display); font-size: 24px; font-weight: 700; line-height: 1.15; }
.callout .vs em { font-style: normal; color: var(--muted); font-weight: 500; font-size: .7em; padding: 0 6px; }
.callout.next { border-color: var(--next); background: var(--next-soft); }
.callout.next .label { color: var(--next); }
.callout.champ { border-color: var(--win); background: var(--win-soft); grid-column: 1 / -1; flex-direction: row; align-items: center; gap: 20px; flex-wrap: wrap; }
.champ .crown { font-family: var(--display); font-size: clamp(30px, 5vw, 52px); font-weight: 700; line-height: 1; }
.champ .label { color: var(--win); }
.podium { display: flex; gap: 18px; flex-wrap: wrap; font-size: 15px; color: var(--muted); }
.podium b { color: var(--fg); font-weight: 600; }

.tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.tools .hint { margin-right: auto; }
.zoom { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 7px; overflow: hidden; background: var(--surface); }
.zoom button { border: 0; background: transparent; padding: 5px 11px; font-weight: 600; }
.zoom button:hover { background: var(--surface-2); }
.zoom span { font-family: var(--mono); font-size: 12.5px; min-width: 48px; text-align: center; border-inline: 1px solid var(--line); padding: 6px 4px; font-variant-numeric: tabular-nums; }

.section { margin-bottom: 30px; scroll-margin-top: 70px; }
.match { scroll-margin: 90px 40px; }
.section > h2 { font-size: 26px; margin-bottom: 10px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.section > h2 small { font-family: var(--body); font-size: 13.5px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.scroll { overflow-x: auto; padding-bottom: 8px; }
.elim { position: relative; }
.elim svg.wires { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.wires path { fill: none; stroke: var(--line-strong); stroke-width: 1.5; }
.wires path.lit { stroke: var(--win); stroke-width: 2; }
.wires path.faint { stroke-dasharray: 3 4; opacity: .6; }
.col-head { position: absolute; top: 0; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.wires path.drop { stroke-dasharray: 6 5; }
.wires path.dim { opacity: .2; }
.wires path.divider { stroke: var(--line); stroke-dasharray: 2 6; }
.mhead[data-focus] { cursor: pointer; }
.mhead[data-focus]:hover .mnum { color: var(--accent); text-decoration: underline; }
.wires path.drop { stroke-dasharray: 6 5; }
.wires path.dim { opacity: .2; }
.wires path.focus { stroke: var(--accent); stroke-width: 2.5; opacity: 1; }
.match.dim { opacity: .3; }
.match.dim.ghost { opacity: .15; }
.match.rel { border-color: var(--accent); }
.match.focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent), var(--shadow); z-index: 2; }
.match.focus .mhead { background: var(--accent-soft); }
.mhead .fs-btn { border: 0; background: var(--accent); color: var(--accent-fg); font-family: var(--body); font-size: 11.5px; font-weight: 600; padding: 0 7px; height: 18px; border-radius: 4px; }
.focus-chip { display: inline-flex; align-items: center; gap: 4px; padding-left: 12px; border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 7px; font-weight: 600; font-size: 14px; flex-wrap: wrap; }

/* match view */
body.mv-open { overflow: hidden; }
.mv { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; gap: 16px;
  padding-inline: max(16px, 3vw); padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; }
.mv-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.mv-top h2 { font-size: clamp(26px, 3.4vw, 46px); line-height: 1.05; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.mv-top h2 small { font-family: var(--body); font-size: 15px; font-weight: 500; color: var(--muted); }
.mv-nav { display: flex; gap: 8px; flex-wrap: wrap; }
.mv-stage { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 2vw; align-items: stretch; }
.mv-team { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2vh; min-width: 0; min-height: 220px;
  background: var(--surface); border: 2px solid var(--line-strong); border-radius: 18px; padding: 24px 16px; text-align: center; }
button.mv-team:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.mv-team:disabled { cursor: default; }
.mv-seed { font-family: var(--mono); font-size: clamp(13px, 1.3vw, 18px); color: var(--muted); }
.mv-name { font-family: var(--display); font-weight: 700; font-size: clamp(34px, 6.5vw, 120px); line-height: 1; overflow-wrap: anywhere; text-wrap: balance; }
.mv-score { font-family: var(--mono); font-weight: 600; font-size: clamp(64px, 13vw, 240px); line-height: 1; font-variant-numeric: tabular-nums; }
.mv-pips { display: flex; gap: 12px; }
.mv-pips i { width: clamp(16px, 2vw, 28px); aspect-ratio: 1; border-radius: 50%; border: 3px solid var(--line-strong); }
.mv-pips i.on { background: var(--win); border-color: var(--win); }
.mv-tag { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); background: var(--win); color: var(--surface); font-weight: 600; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; padding: 3px 12px; border-radius: 5px; }
.mv-team.win { border-color: var(--win); background: var(--win-soft); }
.mv-team.lose { opacity: .55; }
.mv-team.tbd .mv-name { font-size: clamp(22px, 3vw, 44px); color: var(--muted); font-style: italic; font-weight: 500; }
.mv-vs { align-self: center; font-family: var(--display); font-size: clamp(24px, 3vw, 48px); font-weight: 600; color: var(--muted); text-transform: uppercase; }
.mv-banner { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  border: 1px solid var(--win); background: var(--win-soft); border-radius: 12px; padding: 14px 18px; font-size: clamp(17px, 1.8vw, 26px); }
.mv-banner.champ { justify-content: center; font-family: var(--display); font-size: clamp(28px, 4vw, 60px); }
.mv-acts { display: flex; gap: 8px; flex-wrap: wrap; }
.mv-count { position: absolute; left: 0; bottom: 0; height: 4px; width: 100%; background: var(--win); transform-origin: left; animation: mvcount linear forwards; }
@keyframes mvcount { from { transform: scaleX(1); } to { transform: scaleX(0); } }
.mv-hint { margin: 0; color: var(--muted); font-size: 13.5px; text-align: center; }
@media (max-width: 700px) {
  .mv-stage { grid-template-columns: minmax(0, 1fr); }
  .mv-team { min-height: 160px; }
}
@media (prefers-reduced-motion: reduce) { .mv-count { animation: none; } }
.side-label { position: absolute; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

/* match card */
.match {
  width: 230px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px;
  box-shadow: var(--shadow); overflow: hidden;
}
.elim .match { position: absolute; }
.mhead { display: flex; align-items: center; gap: 6px; height: 22px; padding: 0 4px 0 8px; font-family: var(--mono); font-size: 11.5px; color: var(--muted); background: var(--surface-2); border-bottom: 1px solid var(--line); }
.mhead .mnum { font-weight: 600; color: var(--fg); }
.mhead .pill { font-family: var(--body); font-weight: 600; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; padding: 0 6px; border-radius: 4px; line-height: 16px; }
.pill.next { background: var(--next); color: var(--surface); }
.pill.deck { border: 1px solid var(--next); color: var(--next); }
.pill.live { background: var(--accent); color: var(--accent-fg); }
.mhead .edit { margin-left: auto; border: 0; background: transparent; color: var(--muted); font-family: var(--body); font-size: 12px; font-weight: 600; padding: 0 6px; height: 20px; border-radius: 4px; }
.mhead .edit:hover { background: var(--line); color: var(--fg); }
.slot {
  display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; gap: 4px;
  width: 100%; height: 34px; padding: 0 10px 0 6px; border: 0; background: transparent; text-align: left;
}
.slot + .slot { border-top: 1px solid var(--line); }
.slot .sd { font-family: var(--mono); font-size: 11.5px; color: var(--muted); text-align: right; padding-right: 4px; font-variant-numeric: tabular-nums; }
.slot .nm { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot .sc { font-family: var(--mono); font-weight: 600; font-size: 14px; min-width: 18px; text-align: right; font-variant-numeric: tabular-nums; }
button.slot:hover { background: var(--accent-soft); }
.slot.win { background: var(--win-soft); }
.slot.win .nm::after { content: " ✓"; color: var(--win); }
.slot.win .sc { color: var(--win); }
.slot.lose .nm, .slot.lose .sc { color: var(--muted); font-weight: 500; }
.slot.lose .nm { text-decoration: line-through; text-decoration-color: var(--line-strong); }
.slot.tbd { cursor: default; }
.slot.tbd .nm { color: var(--muted); font-weight: 500; font-style: italic; font-size: 13.5px; }
.slot.byeslot .nm { color: var(--muted); font-weight: 500; font-size: 13.5px; }
.match.next { border-color: var(--next); box-shadow: 0 0 0 2px var(--next), var(--shadow); }
.match.deck { border-color: var(--next); border-style: dashed; }
.match.live { border-color: var(--accent); }
.match.ghost { opacity: .5; box-shadow: none; border-style: dashed; background: transparent; }
.match.ghost .mhead { background: transparent; }
.match.flash { animation: flash 1.2s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 6px var(--next); } 100% { box-shadow: 0 0 0 2px var(--next); } }

.rounds { display: flex; gap: 18px; align-items: flex-start; }
.round-col { display: flex; flex-direction: column; gap: 10px; flex: none; }
.round-col h3 { font-family: var(--body); font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sits { font-size: 12.5px; color: var(--muted); max-width: 230px; }

.std-wrap { overflow-x: auto; }
table.std { border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-width: 340px; font-variant-numeric: tabular-nums; }
.std th, .std td { padding: 7px 12px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
.std th { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); }
.std td { font-family: var(--mono); font-size: 13.5px; }

<script>
"use strict";
const BYE = "BYE";
const LS_T = "boutboard.tournament.v1";
const LS_D = "boutboard.draft.v1";
const LS_Z = "boutboard.zoom";
const CW = 230, CH = 92, SLOT = 108, GAP = 56, HEAD = 30;

const STYLES = {
  se: { name: "Single elimination", blurb: "Lose once and you are out. The quickest way to a champion." },
  de: { name: "Double elimination", blurb: "Out after two losses. A losers bracket gives every team a second chance." },
  rr: { name: "Round robin", blurb: "Everyone plays everyone once. Best for small fields." },
  sw: { name: "Swiss", blurb: "A set number of rounds. Teams with similar records meet each round." },
  gp: { name: "Groups + playoffs", blurb: "Round-robin pools, then the top teams play single elimination." },
};
const ICONS = {
  se: '<svg viewBox="0 0 42 26" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h8v6H2M2 17h8v6H2M10 6h6v14h-6M16 13h8M24 13h6"/></svg>',
  de: '<svg viewBox="0 0 42 26" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 2h7v5H2M9 4.5h6v4h6M2 19h7v5H2M9 21.5h6v-4h6M21 8.5v9M21 13h12"/><circle cx="37" cy="13" r="3"/></svg>',
  rr: '<svg viewBox="0 0 42 26" fill="none" stroke="currentColor" stroke-width="2"><circle cx="21" cy="4" r="2.5"/><circle cx="9" cy="21" r="2.5"/><circle cx="33" cy="21" r="2.5"/><path d="M19.5 6 10.5 19M22.5 6l9 13M11.5 21h19"/></svg>',
  sw: '<svg viewBox="0 0 42 26" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h10M3 13h10M3 21h10M17 5l8 8M17 13l8-8M17 21h8M29 5h10M29 13h10M29 21h10"/></svg>',
  gp: '<svg viewBox="0 0 42 26" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="12" height="9" rx="1.5"/><rect x="2" y="15" width="12" height="9" rx="1.5"/><path d="M14 6.5h6v13h-6M20 13h8M28 13h8"/></svg>',
};
const EXAMPLE_NAMES = ["Low Blade", "Ring Out", "Magneto Mk2", "Brick", "Tiny Tank", "Wedge Antilles", "Pushover", "Shiko Sam"];

/* ---------- storage ---------- */
function lsGet(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function lsSet(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

function defaultDraft() {
  return {
    name: "Sumo Bot Showdown", count: 8, names: EXAMPLE_NAMES.slice(), example: true,
    style: "se", seeding: "list", bo: 3, finalBo: 3, layout: "right",
    third: true, reset: true, rounds: 0, groups: 2, advance: 2, ptsWin: 1,
  };
}
let draft = Object.assign(defaultDraft(), lsGet(LS_D) || {});
let T = lsGet(LS_T);
if (T && (!T.matches || !T.teams)) T = null;
let view = T ? "board" : "setup";
let zoom = +(lsGet(LS_Z) || 1);
const ui = { mv: null, mvStay: false, mvArm: false, focus: null };
document.addEventListener("keydown", e => {
  if ($("#modal-root").firstElementChild) return;
  if (!ui.mv) { if (e.key === "Escape" && ui.focus) { ui.focus = null; render(); } return; }
  if (e.key === "Escape") closeMatchView();
  else if (e.key === "ArrowLeft") { const b = $("#mv-prev"); if (b && !b.disabled) b.click(); }
  else if (e.key === "ArrowRight") { const b = $("#mv-next"); if (b && !b.disabled) b.click(); }
});
const saveDraft = () => lsSet(LS_D, draft);
const saveT = () => lsSet(LS_T, T);

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pow2 = n => { let p = 1; while (p < n) p *= 2; return p; };
const TEAM = id => ({ t: "team", id });
const BYESLOT = { t: "bye" };
const W = m => ({ t: "W", m });
const L = m => ({ t: "L", m });
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function seedOrder(P) { let a = [1]; while (a.length < P) { const n = a.length * 2; a = a.flatMap(s => [s, n + 1 - s]); } return a; }
function swissAutoRounds(n) { return clamp(Math.ceil(Math.log2(Math.max(2, n))), 1, n - 1); }
function groupSizes(n, g) { const s = Array(g).fill(0); for (let i = 0; i < n; i++) s[snakeGroup(i, g)]++; return s; }
function snakeGroup(i, g) { const row = Math.floor(i / g); return row % 2 ? g - 1 - (i % g) : i % g; }

/* ---------- build a tournament ---------- */
function buildTournament(d) {
  const n = d.count;
  const teams = d.names.slice(0, n).map((nm, i) => ({ id: "t" + i, name: (nm || "").trim() || `Team ${i + 1}` }));
  if (d.seeding === "shuffle") shuffle(teams);
  const t = {
    v: 1, name: d.name.trim() || "Tournament", style: d.style, layout: d.layout === "center" ? "center" : "right", bo: +d.bo, finalBo: +d.finalBo,
    opts: { third: !!d.third, reset: !!d.reset, rounds: 0, groups: 0, advance: 0, ptsWin: +d.ptsWin || 1 },
    teams, matches: [], results: {}, nextId: 0, swissRound: 0, created: Date.now(),
  };
  const add = props => { const m = Object.assign({ id: "m" + t.nextId++ }, props); t.matches.push(m); return m.id; };
  const get = id => t.matches.find(m => m.id === id);
  const ids = teams.map(x => x.id);
  const seedSlots = (list, P) => { const s = list.map(x => typeof x === "string" ? TEAM(x) : x); while (s.length < P) s.push(BYESLOT); return s; };

  const elim = (slots, br) => {
    const P = slots.length, ord = seedOrder(P), rounds = [];
    let prev = [];
    for (let i = 0; i < P / 2; i++) prev.push(add({ br, rd: 1, a: slots[ord[2 * i] - 1], b: slots[ord[2 * i + 1] - 1] }));
    rounds.push(prev);
    while (prev.length > 1) {
      const cur = [];
      for (let i = 0; i < prev.length / 2; i++) cur.push(add({ br, rd: rounds.length + 1, a: W(prev[2 * i]), b: W(prev[2 * i + 1]) }));
      rounds.push(cur); prev = cur;
    }
    const fin = get(prev[0]); fin.fin = true; fin.champ = true;
    if (d.third && rounds.length >= 2) {
      const semis = rounds[rounds.length - 2];
      const tid = add({ br: "3", rd: 1, a: L(semis[0]), b: L(semis[1]), third: true });
      // the 3rd-place match is played before the final
      t.matches.splice(t.matches.indexOf(fin), 1); t.matches.push(fin);
      t.thirdId = tid;
    }
    return rounds;
  };

  if (d.style === "se") {
    elim(seedSlots(ids, pow2(n)), "W");
  } else if (d.style === "de") {
    const P = pow2(n), k = Math.log2(P), slots = seedSlots(ids, P), ord = seedOrder(P);
    const WB = [[]], LB = [];
    for (let i = 0; i < P / 2; i++) WB[0].push(add({ br: "W", rd: 1, a: slots[ord[2 * i] - 1], b: slots[ord[2 * i + 1] - 1] }));
    if (k >= 2) {
      const r1 = [];
      for (let i = 0; i < P / 4; i++) r1.push(add({ br: "L", rd: 1, a: L(WB[0][2 * i]), b: L(WB[0][2 * i + 1]) }));
      LB.push(r1);
    }
    for (let j = 2; j <= k; j++) {
      const prev = WB[j - 2], cur = [];
      for (let i = 0; i < prev.length / 2; i++) cur.push(add({ br: "W", rd: j, a: W(prev[2 * i]), b: W(prev[2 * i + 1]) }));
      WB.push(cur);
      const lbPrev = LB[LB.length - 1];
      const drops = j % 2 === 0 ? cur.slice().reverse() : cur; // alternate to avoid instant rematches
      const dr = [];
      for (let i = 0; i < lbPrev.length; i++) dr.push(add({ br: "L", rd: LB.length + 1, a: W(lbPrev[i]), b: L(drops[i]) }));
      LB.push(dr);
      if (j < k) {
        const c = [];
        for (let i = 0; i < dr.length / 2; i++) c.push(add({ br: "L", rd: LB.length + 1, a: W(dr[2 * i]), b: W(dr[2 * i + 1]) }));
        LB.push(c);
      }
    }
    const wbFinal = WB[k - 1][0];
    const lbChamp = k >= 2 ? W(LB[LB.length - 1][0]) : L(wbFinal);
    t.gf = add({ br: "F", rd: 1, a: W(wbFinal), b: lbChamp, fin: true });
    if (d.reset) t.gfReset = add({ br: "F", rd: 2, cond: "reset", ref: t.gf, fin: true });
    t.lbFinal = k >= 2 ? LB[LB.length - 1][0] : null;
  } else if (d.style === "rr") {
    rrRounds(ids).forEach((pairs, r) => pairs.forEach(([a, b]) => add({ br: "RR", rd: r + 1, a: TEAM(a), b: TEAM(b) })));
  } else if (d.style === "sw") {
    t.opts.rounds = clamp(+d.rounds || swissAutoRounds(n), 1, n - 1);
    const list = ids.slice();
    let byeId = null;
    if (list.length % 2) byeId = list.pop();
    const h = list.length / 2;
    for (let i = 0; i < h; i++) add({ br: "S", rd: 1, a: TEAM(list[i]), b: TEAM(list[i + h]) });
    if (byeId) add({ br: "S", rd: 1, a: TEAM(byeId), b: BYESLOT });
    t.swissRound = 1;
  } else if (d.style === "gp") {
    const G = clamp(+d.groups || 2, 1, Math.floor(n / 2));
    const groups = Array.from({ length: G }, () => []);
    ids.forEach((id, i) => groups[snakeGroup(i, G)].push(id));
    const K = clamp(+d.advance || 2, 1, Math.min(...groups.map(g => g.length)));
    t.opts.groups = G; t.opts.advance = K; t.groups = groups;
    const sched = groups.map(g => rrRounds(g));
    const maxR = Math.max(...sched.map(s => s.length));
    for (let r = 0; r < maxR; r++) sched.forEach((s, g) => (s[r] || []).forEach(([a, b]) => add({ br: "G" + g, rd: r + 1, a: TEAM(a), b: TEAM(b) })));
    if (G * K >= 2) {
      const ps = [];
      for (let r = 0; r < K; r++) for (let g = 0; g < G; g++) ps.push({ t: "grp", g, r });
      elim(seedSlots(ps, pow2(ps.length)), "P");
    }
  }
  return t;
}

function rrRounds(ids) {
  const arr = ids.slice();
  if (arr.length % 2) arr.push(BYE);
  const n = arr.length, rounds = [];
  for (let r = 0; r < n - 1; r++) {
    const pairs = [];
    for (let i = 0; i < n / 2; i++) {
      const x = arr[i], y = arr[n - 1 - i];
      if (x !== BYE && y !== BYE) pairs.push(r % 2 && i === 0 ? [y, x] : [x, y]);
    }
    rounds.push(pairs);
    arr.splice(1, 0, arr.pop());
  }
  return rounds;
}

/* ---------- resolve the bracket from results ---------- */
function compute(t, results = t.results) {
  const out = {}, removed = [], groupCache = {};
  const res = s => {
    if (!s) return null;
    if (s.t === "team") return s.id;
    if (s.t === "bye") return BYE;
    if (s.t === "W") return out[s.m] ? out[s.m].winner : null;
    if (s.t === "L") return out[s.m] ? out[s.m].loser : null;
    if (s.t === "grp") return groupRank(s.g, s.r);
    return null;
  };
  function groupRank(g, r) {
    if (!(g in groupCache)) {
      const ms = t.matches.filter(m => m.br === "G" + g);
      const done = ms.every(m => out[m.id] && out[m.id].status === "done");
      groupCache[g] = done ? standings(t, t.groups[g], ms, out).map(x => x.id) : null;
    }
    const st = groupCache[g];
    return st ? (st[r] ?? BYE) : null;
  }
  for (const m of t.matches) {
    let A, B, skip = false;
    if (m.cond === "reset") {
      const g = out[m.ref];
      if (!g || g.winner == null) { A = null; B = null; }
      else { A = g.A; B = g.B; skip = g.winner === g.A; }
    } else { A = res(m.a); B = res(m.b); }
    const o = { A, B, winner: null, loser: null, status: "pending", r: null };
    const r = results[m.id];
    if (skip) { o.status = "skip"; if (r) removed.push(m.id); }
    else if (A === BYE || B === BYE) {
      o.status = "bye"; o.loser = BYE;
      o.winner = A === BYE ? B : A;
      if (r) removed.push(m.id);
    } else if (A != null && B != null) {
      if (r && r.ta === A && r.tb === B) {
        o.r = r;
        if (r.win != null) { o.winner = r.win === 0 ? A : B; o.loser = r.win === 0 ? B : A; o.status = "done"; }
        else o.status = "live";
      } else { if (r) removed.push(m.id); o.status = "ready"; }
    } else if (r) removed.push(m.id);
    out[m.id] = o;
  }
  return { out, removed };
}

function standings(t, ids, ms, out) {
  const rows = new Map(ids.map((id, i) => [id, { id, seed: seedOf(t, id), p: 0, w: 0, l: 0, sf: 0, sa: 0, bye: 0, opp: [], beat: new Set() }]));
  for (const m of ms) {
    const o = out[m.id];
    if (!o) continue;
    if (o.status === "bye") {
      const row = rows.get(o.winner);
      if (row) { row.p++; row.w++; row.bye++; }
      continue;
    }
    if (o.status !== "done") continue;
    const w = rows.get(o.winner), l = rows.get(o.loser);
    if (!w || !l) continue;
    w.p++; l.p++; w.w++; l.l++; w.beat.add(l.id); w.opp.push(l.id); l.opp.push(w.id);
    const s = o.r && o.r.s;
    if (s) {
      const ws = o.winner === o.A ? s[0] : s[1], ls = o.winner === o.A ? s[1] : s[0];
      w.sf += ws; w.sa += ls; l.sf += ls; l.sa += ws;
    }
  }
  const pw = t.opts.ptsWin || 1;
  rows.forEach(r => { r.pts = r.w * pw; r.diff = r.sf - r.sa; });
  rows.forEach(r => { r.bh = r.opp.reduce((a, id) => a + (rows.get(id) ? rows.get(id).w : 0), 0); });
  const swiss = t.style === "sw";
  return [...rows.values()].sort((a, b) =>
    b.pts - a.pts ||
    (swiss ? b.bh - a.bh : (b.beat.has(a.id) ? 1 : a.beat.has(b.id) ? -1 : 0)) ||
    b.diff - a.diff || a.seed - b.seed);
}

function seedOf(t, id) {
  if (!t._seed) { t._seed = {}; }
  if (!(id in t._seed)) t._seed[id] = t.teams.findIndex(x => x.id === id) + 1;
  return t._seed[id];
}
const teamName = id => { const x = T.teams.find(tt => tt.id === id); return x ? x.name : "?"; };
const boOf = m => m.bo || (m.fin ? T.finalBo : T.bo);
const getM = id => T.matches.find(m => m.id === id);

function podium(out) {
  const ok = id => id && id !== BYE ? id : null;
  if (T.style === "se" || T.style === "gp") {
    const fin = T.matches.find(m => m.champ);
    if (!fin) { // groups with a single qualifier
      if (T.style === "gp") return groupOnlyPodium(out);
      return [null, null, null];
    }
    const f = out[fin.id];
    const third = T.thirdId ? out[T.thirdId] : null;
    return [ok(f.winner), ok(f.loser), third ? ok(third.winner) : null];
  }
  if (T.style === "de") {
    const g = out[T.gf], rs = T.gfReset ? out[T.gfReset] : null;
    let decider = g;
    if (g.winner != null && rs && g.winner === g.B) decider = rs;
    const lb = T.lbFinal ? out[T.lbFinal] : null;
    return [ok(decider.winner), ok(decider.loser), lb ? ok(lb.loser) : null];
  }
  if (T.style === "rr" || T.style === "sw") {
    const all = T.matches.every(m => ["done", "bye"].includes(out[m.id].status));
    const finished = all && (T.style === "rr" || T.swissRound >= T.opts.rounds);
    if (!finished) return [null, null, null];
    const st = standings(T, T.teams.map(x => x.id), T.matches, out);
    return [st[0] && st[0].id, st[1] && st[1].id, st[2] && st[2].id];
  }
  return [null, null, null];
}
function groupOnlyPodium(out) {
  const ms = T.matches.filter(m => m.br === "G0");
  if (!ms.every(m => out[m.id].status === "done")) return [null, null, null];
  const st = standings(T, T.groups[0], ms, out);
  return [st[0] && st[0].id, st[1] && st[1].id, st[2] && st[2].id];
}

/* ---------- recording results ---------- */
async function commit(mid, next) {
  const m = getM(mid);
  if (T.style === "sw" && m.rd < T.swissRound) {
    const ok = await confirmBox("Change an earlier round?",
      `Swiss pairings depend on earlier results. Changing a round ${m.rd} result removes the pairings and results for round ${m.rd + 1}${T.swissRound > m.rd + 1 ? "–" + T.swissRound : ""}.`, "Change and re-pair later");
    if (!ok) return;
    const drop = T.matches.filter(x => x.rd > m.rd).map(x => x.id);
    drop.forEach(id => delete T.results[id]);
    T.matches = T.matches.filter(x => x.rd <= m.rd);
    T.swissRound = m.rd;
  }
  const trial = Object.assign({}, T.results);
  if (next) trial[mid] = next; else delete trial[mid];
  const { removed } = compute(T, trial);
  const lost = removed.filter(id => trial[id] && (trial[id].win != null || trial[id].s));
  if (lost.length) {
    const ok = await confirmBox("Clear later results?",
      `${lost.length} later ${lost.length === 1 ? "match depends" : "matches depend"} on this result and will be cleared.`, "Clear and continue");
    if (!ok) return;
  }
  removed.forEach(id => delete trial[id]);
  T.results = trial;
  saveT(); render();
}

function clickSlot(mid, side) {
  const { out } = compute(T);
  const o = out[mid], m = getM(mid);
  if (!["ready", "live", "done"].includes(o.status)) return;
  const bo = boOf(m), need = Math.ceil(bo / 2);
  const r = T.results[mid];
  let next;
  if (r && r.win != null) {
    if (r.win === side) {
      if (bo === 1) next = null;
      else { // step back one round
        const s = r.s ? r.s.slice() : [0, 0];
        s[side] = Math.max(0, s[side] - 1);
        next = s[0] || s[1] ? { ta: o.A, tb: o.B, s, win: null } : null;
      }
    } else if (bo === 1) next = { ta: o.A, tb: o.B, s: r.s || null, win: side };
    else { toast("Click the winner to step back a round, or use Edit to change the score."); return; }
  } else if (bo === 1) next = { ta: o.A, tb: o.B, s: r ? r.s : null, win: side };
  else {
    const s = r && r.s ? r.s.slice() : [0, 0];
    s[side]++;
    next = { ta: o.A, tb: o.B, s, win: s[side] >= need ? side : null };
  }
  commit(mid, next);
}

function pairSwiss() {
  const { out } = compute(T);
  const ms = T.matches.filter(m => m.br === "S");
  const st = standings(T, T.teams.map(x => x.id), ms, out);
  const played = new Set(), hadBye = new Set();
  const pk = (a, b) => a < b ? a + "|" + b : b + "|" + a;
  ms.forEach(m => { const o = out[m.id]; if (o.status === "bye") hadBye.add(o.winner); else if (o.A && o.B) played.add(pk(o.A, o.B)); });
  const list = st.map(r => r.id);
  const rd = T.swissRound + 1;
  let byeId = null;
  if (list.length % 2) {
    let idx = list.length - 1;
    while (idx >= 0 && hadBye.has(list[idx])) idx--;
    if (idx < 0) idx = list.length - 1;
    byeId = list.splice(idx, 1)[0];
  }
  const pairUp = allowRematch => {
    let steps = 0;
    const rec = rest => {
      if (!rest.length) return [];
      if (++steps > 30000) return null;
      const [a, ...others] = rest;
      for (let i = 0; i < others.length; i++) {
        if (!allowRematch && played.has(pk(a, others[i]))) continue;
        const sub = rec(others.filter((_, j) => j !== i));
        if (sub) return [[a, others[i]], ...sub];
      }
      return null;
    };
    return rec(list);
  };
  const pairs = pairUp(false) || pairUp(true);
  pairs.forEach(([a, b]) => T.matches.push({ id: "m" + T.nextId++, br: "S", rd, a: TEAM(a), b: TEAM(b) }));
  if (byeId) T.matches.push({ id: "m" + T.nextId++, br: "S", rd, a: TEAM(byeId), b: BYESLOT });
  T.swissRound = rd;
  saveT(); render();
  toast(`Round ${rd} paired.`);
}

/* ---------- modal helpers ---------- */
function openModal(html, onMount) {
  const root = $("#modal-root");
  root.innerHTML = `<div class="overlay"><div class="dialog" role="dialog" aria-modal="true">${html}</div></div>`;
  const ov = root.firstElementChild;
  const close = () => { root.innerHTML = ""; document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") { close(); ov._onCancel && ov._onCancel(); } };
  document.addEventListener("keydown", onKey);
  ov.addEventListener("mousedown", e => { if (e.target === ov) { close(); ov._onCancel && ov._onCancel(); } });
  onMount(ov.firstElementChild, close, fn => ov._onCancel = fn);
}
function confirmBox(title, msg, okLabel = "Confirm", danger = true) {
  return new Promise(resolve => {
    openModal(`<h2>${esc(title)}</h2><p>${esc(msg)}</p><div class="acts"><button class="btn" data-x="no">Cancel</button><button class="btn ${danger ? "danger" : "primary"}" data-x="yes">${esc(okLabel)}</button></div>`,
      (dlg, close, onCancel) => {
        onCancel(() => resolve(false));
        dlg.querySelector('[data-x="no"]').onclick = () => { close(); resolve(false); };
        const y = dlg.querySelector('[data-x="yes"]'); y.onclick = () => { close(); resolve(true); }; y.focus();

}
let toastTimer;
function toast(msg) {

  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
}

function editMatch(mid) {
  const { out } = compute(T);
  const o = out[mid], m = getM(mid);
  if (!["ready", "live", "done"].includes(o.status)) return;
  const r = T.results[mid] || {};

  openModal(`
    <h2>Edit match</h2>

    <div class="score-grid">

    (dlg, close) => {
      const sa = $("#ed-sa", dlg), sb = $("#ed-sb", dlg);

      const auto = () => {
        if (bo === 1) return;
        const need = Math.ceil(bo / 2), a = +sa.value || 0, b = +sb.value || 0;
        win = a >= need && a > b ? 0 : b >= need && b > a ? 1 : null; paintWin();
      };
      paintWin();
      dlg.querySelectorAll("#ed-bo button").forEach(b => b.onclick = () => {
        bo = +b.dataset.v; dlg.querySelectorAll("#ed-bo button").forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.v === bo))); auto();
      });
      dlg.querySelectorAll("#ed-win button").forEach(b => b.onclick = () => { win = b.dataset.v === "" ? null : +b.dataset.v; paintWin(); });
      sa.oninput = sb.oninput = auto;
      $("#ed-cancel", dlg).onclick = close;

      $("#ed-save", dlg).onclick = () => {

        const sc = hasScore ? [Math.max(0, +sa.value || 0), Math.max(0, +sb.value || 0)] : null;
        close();
        if (!sc && win == null) commit(mid, null);

      };
      sa.focus();
    });
}

/* ---------- render: setup ---------- */
function estimate(d) {
  const n = d.count;
  if (d.style === "se") return `${n - 1 + (d.third && n >= 3 ? 1 : 0)} matches`;
  if (d.style === "de") return `${2 * n - 2}–${2 * n - 2 + (d.reset ? 1 : 0)} matches`;
  if (d.style === "rr") return `${n * (n - 1) / 2} matches · ${n % 2 ? n : n - 1} rounds`;
  if (d.style === "sw") { const r = clamp(+d.rounds || swissAutoRounds(n), 1, n - 1); return `${r * Math.floor(n / 2)} matches · ${r} rounds`; }
  if (d.style === "gp") {
    const G = clamp(+d.groups || 2, 1, Math.floor(n / 2)), sizes = groupSizes(n, G);
    const K = clamp(+d.advance || 2, 1, Math.min(...sizes)), Q = G * K;
    const gm = sizes.reduce((a, s) => a + s * (s - 1) / 2, 0);
    return `${gm + (Q >= 2 ? Q - 1 + (d.third && Q >= 3 ? 1 : 0) : 0)} matches`;
  }
  return "";
}
